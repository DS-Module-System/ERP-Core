# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
imports:
    - { resource: 'roles/*.yaml' }
    - { resource: 'documentation.yaml' }
    
parameters:
    # Всички роли от всички модули (автоматично генерирани от RoleManager)
    roles: []
    container.dumper.inline_factories: true
    upload_directory: '%kernel.project_dir%/public/uploads'
    upload_web_directory: '/uploads'
    datatable_ipp:
        - 10
        - 25
        - 50
        - 100
        - 250
        - 500
        - 1000
    datatable_ipp_default: 25
    default_language: bg
    #    default_language: '%default_language%'
    languages:
        - bg
        - en
    full_languages:
        bg: 'Bulgarian'
        en: 'English'
    image_sizes:
      - 0x0
    # CMS Options
    # menu_tags:
    #     top: "Top Menu"
    #     footer: "Footer Menu"
    #     left: "Left Menu"
     #   page modulite trqbva home_page => HomePage, static_page => StaticPage Asociaciq s Entity classa
    # page_modules:
    #     home_page:
    #         title: "Home Page"
    #         fe_class: "App\\Controller\\Website\\Frontend\\HomePageController::index"
    #     static_page:
    #         title: "Static Page"
    #         fe_class: "App\\Controller\\Website\\Frontend\\StaticPageController::index"
    #         module_multiple: true
    #     redirect_page:
    #         title: "Redirect Page"
    #         fe_class: "App\\Controller\\Website\\Frontend\\RedirectPageController::index"
    #         module_multiple: true
    #     blog_page:
    #         title: "Blog Page"
    #         fe_class: "App\\Controller\\Website\\Frontend\\BlogPageController::index"
    #         urls: true
    #     contact_page:
    #         title: "Contact Page"
    #         fe_class: "App\\Controller\\Website\\Frontend\\ContactPageController::index"
    #         module_multiple: true
    # erp_prefix: '%env(default::ERP_PREFIX)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    app.menu_builder:
        class: App\Menu\Builder
        arguments: [ "@knp_menu.factory" ]
        tags:
            - { name: knp_menu.menu_builder, method: createMainMenu, alias: main } # The alias is what is used to retrieve the menu

    App\Service\Core\FileService:
        arguments:
            $targetDirectory: '%upload_directory%'
            $webDirectory: '%upload_web_directory%'

    App\EventListener\Core\FileAssociationListener:
        tags:
            - { name: doctrine.orm.entity_listener, event: postRemove, entity: 'App\Entity\Core\FileAssociation' }

    App\EventListener\Core\FileListener:
        tags:
            - { name: doctrine.orm.entity_listener, event: postRemove, entity: 'App\Entity\Core\File' }


    monolog.processor.web:
        class: App\Logger\WebProcessor
        tags:
            - { name: monolog.processor, method: __invoke }

    App\Twig\Core\ContextExtension:
        tags: [ { name: twig.extension, priority: -1000 } ]

    App\Service\Core\DomainTranslationService:
        arguments:
            $projectDir: '%kernel.project_dir%'

    App\Twig\Core\DomainTranslationExtension:
        tags: [ { name: twig.extension } ]

    # RoleManager сервиз за управление на ролите
    App\Service\Core\RoleManager:
        arguments:
            $parameterBag: '@parameter_bag'

    App\Service\User\RoleLoader:
        arguments:
            $projectDir: '%kernel.project_dir%'

    # App\Service\Website\FormLanguageService:
    #     arguments:
    #         $languages: '%languages%'

