# config/packages/security.yaml
security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#where-do-users-come-from-user-providers
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User\BaseUser
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: app_user_provider

            pattern: ^/
            user_checker: App\Security\Core\UserChecker

            form_login:
                # "app_login" is the name of the route created previously
                login_path: app_login
                check_path: app_login
                enable_csrf: true

            json_login:
                check_path: api_login

            # by default, the feature allows 5 login attempts per minute
            login_throttling: null

            logout:
                path: app_logout

            two_factor:
                auth_form_path: 2fa_login    # The route name you have used in the routes.yaml
                check_path: 2fa_login_check  # The route name you have used in the routes.yaml

            remember_me:
                secret: '%kernel.secret%' # required
                lifetime: 604800 # 1 week in seconds
                # by default, the feature is enabled by checking a
                # checkbox in the login form (see below), uncomment the
                # following line to always enable it.
                #always_remember_me: true
                token_provider:
                    doctrine: true

            # activate different ways to authenticate
            # https://symfony.com/doc/current/security.html#firewalls-authentication

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Easy way to control access for large sections of your site
    # Note: Only the *first* access control that matches will be used
    access_control:
        # - { route: "invoice_client_invoice", roles: PUBLIC_ACCESS }
        # - { route: "invoice_preview_by_hash", roles: PUBLIC_ACCESS }
        # - { route: "invoice_download_by_hash", roles: PUBLIC_ACCESS }
        - { route: "app_login", roles: PUBLIC_ACCESS }
        - { route: "app_reset_password", roles: PUBLIC_ACCESS }
        - { route: "app_reset_password_check_email", roles: PUBLIC_ACCESS }
        - { route: "app_reset_password_reset", roles: PUBLIC_ACCESS }
        - { route: "reset_password", roles: PUBLIC_ACCESS }
        - { route: "forgot_password_request", roles: PUBLIC_ACCESS }
        - { route: "2fa_login", roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { route: "2fa_login_en", roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/, roles: ROLE_USER }
        - { path: ^/en/, roles: ROLE_USER }

    role_hierarchy:
        ROLE_ADMIN: [ ROLE_USER ]
        # ROLE_SUPER_ADMIN: [ ROLE_ADMIN ]
        ROLE_SUPER_ADMIN: '%roles%'
        # Всички останали роли се добавят автоматично чрез RoleHierarchyCompilerPass
